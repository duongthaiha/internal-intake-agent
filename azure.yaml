# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: maf-poc
services:
    intake-api:
        project: .
        host: containerapp
        language: python
        docker:
            path: ./Dockerfile.intake
            context: .
            remoteBuild: false
    maf-poc-agent:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - maf-poc-project
        env:
            FOUNDRY_PROJECT_ENDPOINT: ${FOUNDRY_PROJECT_ENDPOINT}
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
            ENABLE_SENSITIVE_DATA: "false"
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
            HISTORY_PROVIDER: cosmos
            RAG_PROVIDER: foundry_iq
            LOG_LEVEL: INFO
            AZURE_COSMOS_ENDPOINT: ${AZURE_COSMOS_ENDPOINT}
            AZURE_COSMOS_DATABASE_NAME: ${AZURE_COSMOS_DATABASE_NAME}
            AZURE_COSMOS_CONTAINER_NAME: ${AZURE_COSMOS_CONTAINER_NAME}
            COSMOS_LOAD_MESSAGES: "false"
            COSMOS_STARTUP_CHECK: ${DEPENDENCY_STARTUP_CHECKS}
            AZURE_SEARCH_ENDPOINT: ${AZURE_SEARCH_ENDPOINT}
            FOUNDRY_IQ_KNOWLEDGE_BASE_NAME: ${FOUNDRY_IQ_KNOWLEDGE_BASE_NAME}
            FOUNDRY_IQ_STARTUP_CHECK: ${DEPENDENCY_STARTUP_CHECKS}
            RAG_AUTO_INDEX: "false"
            TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: agents/hosted/hosted_agent.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: maf-poc-agent
        protocols:
            - protocol: responses
              version: 2.0.0
    maf-poc-project:
        host: azure.ai.project
        endpoint: ${FOUNDRY_PROJECT_ENDPOINT}
infra:
    provider: bicep
    path: infra
